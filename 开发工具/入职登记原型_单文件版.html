    var ext = (type === 'jpeg' || type === 'jpg') ? 'jpeg' : type;
    var bin = root.atob(m[2].replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) & 0xFF;

    var w = 0, h = 0;
    if (ext === 'png' && bytes.length > 24) {
      // PNG：IHDR 从第 16 字节开始，宽高各 4 字节大端
      w = (bytes[16] << 24 | bytes[17] << 16 | bytes[18] << 8 | bytes[19]) >>> 0;
      h = (bytes[20] << 24 | bytes[21] << 16 | bytes[22] << 8 | bytes[23]) >>> 0;
    } else if (ext === 'jpeg') {
      // JPEG：找 SOF0/1/2 段，里面 height(2) width(2)
      var p = 2;
      while (p + 9 < bytes.length) {
        if (bytes[p] !== 0xFF) { p++; continue; }
        var mk = bytes[p + 1];
        if (mk >= 0xC0 && mk <= 0xCF && mk !== 0xC4 && mk !== 0xC8 && mk !== 0xCC) {
          h = bytes[p + 5] << 8 | bytes[p + 6];
          w = bytes[p + 7] << 8 | bytes[p + 8];
          break;
        }
        p += 2 + (bytes[p + 2] << 8 | bytes[p + 3]);
      }
    }
    if (!w || !h) return null;
    return { ext: ext, bytes: bytes, w: w, h: h };
  }

  function drawingXml(rid, cx, cy, id, name) {
    var A = 'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"';
    return '<w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">'
      + '<wp:extent cx="' + cx + '" cy="' + cy + '"/>'
      + '<wp:effectExtent l="0" t="0" r="0" b="0"/>'
      + '<wp:docPr id="' + id + '" name="' + name + '"/>'
      + '<wp:cNvGraphicFramePr><a:graphicFrameLocks ' + A + ' noChangeAspect="1"/></wp:cNvGraphicFramePr>'
      + '<a:graphic ' + A + '><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'
      + '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">'
      + '<pic:nvPicPr><pic:cNvPr id="' + id + '" name="' + name + '"/>'
      + '<pic:cNvPicPr><a:picLocks noChangeAspect="1"/></pic:cNvPicPr></pic:nvPicPr>'
      + '<pic:blipFill><a:blip r:embed="' + rid + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'
      + '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm>'
      + '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>'
      + '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing>';
  }

  /** 按比例缩放，两个方向都不许超 */
  function fitBox(img, maxW, maxH) {
    var k = Math.min(maxW / img.w, maxH / img.h);
    return {
      cx: Math.round(img.w * k * EMU_PER_TWIP),
      cy: Math.round(img.h * k * EMU_PER_TWIP)
    };
  }

  /** {@photo}：整个照片格换掉——有照片就只放照片，没照片就只留「照片」两个字 */
  function putPhoto(xml, img, used, addImage) {
    var key = '{{photo}}';
    var i = xml.indexOf(key);
    if (i < 0) return xml;
    var cs = xml.lastIndexOf('<w:tc>', i), ce = xml.indexOf('</w:tc>', i);
    if (cs < 0 || ce < 0) return xml;

    var tc = xml.slice(cs, ce + 7);
    var head = tc.slice(0, tc.indexOf('<w:p'));          // <w:tc> + tcPr
    if (!img) {
      // 没照片：把 {{photo}} 那一段删掉，还原成模板原本的样子
      var ps = tc.match(/<w:p\b[^>]*>[\s\S]*?<\/w:p>/g) || [];
      var kept = ps.filter(function (p) { return p.indexOf(key) < 0; }).join('');
      return xml.slice(0, cs) + head + kept + '</w:tc>' + xml.slice(ce + 7);
    }

    // 照片格横跨表格前 5 行：可用高 = 5 行行距，标签让位给照片
    var maxH = Math.max(600, 5 * used - 60);
    var tcw = /<w:tcW w:w="(\d+)"/.exec(tc);
    var maxW = Math.min(1531, (tcw ? +tcw[1] : 1747) - 216);
    var sz = fitBox(img, maxW, maxH);

    // 太窄的是噪点，丢掉
    if (!segs.length) return null;
    var widths = segs.map(function (s) { return s.x1 - s.x0; }).sort(function (a, b) { return a - b; });
    var med = widths[Math.floor(widths.length / 2)];
    segs = segs.filter(function (s) { return s.x1 - s.x0 >= med * 0.35; });

    // 粘连处理：太宽的块（像两个字连在一起）从中间找最浅处切开
    var merged = [];
    for (var i = 0; i < segs.length; i++) {
      var wd = segs[i].x1 - segs[i].x0;
      if (wd > med * 1.7 && wd < med * 3.2) {
        var mid = Math.floor((segs[i].x0 + segs[i].x1) / 2);
        var cut = findValley(p, segs[i].x0 + 2, segs[i].x1 - 2, mid);
        merged.push({ x0: segs[i].x0, x1: cut });
        merged.push({ x0: cut, x1: segs[i].x1 });
      } else {
        merged.push(segs[i]);
      }
    }
    return merged;
  }

  /** 在 [a,b] 范围内、靠近 mid 的地方找前景最浅的列 */
  function findValley(p, a, b, mid) {
    var bestX = mid, bestV = 1e9;
    var lo = a + Math.floor((b - a) * 0.3), hi = a + Math.floor((b - a) * 0.7);
    for (var x = lo; x <= hi; x++) {
      if (p[x] < bestV) { bestV = p[x]; bestX = x; }
    }
    return bestX;
  }

  /* ================= 逐字比对 ================= */

  /** 对一个字符块给出所有候选（按相似度降序） */
  function rankChar(data, w, h, seg, y0, y1) {
    var patch = normalizePatch(data, w, h, seg.x0, y0, seg.x1, y1);
    if (!patch) return [{ ch: '?', score: 0 }];
    var tpls = buildTemplates();
    var list = [];
    for (var i = 0; i < CHARS.length; i++) {
      var ch = CHARS.charAt(i);
      list.push({ ch: ch, score: similarity(patch, tpls[ch]) });
    }
    list.sort(function (a, b) { return b.score - a.score; });
    return list;
  }

  /* ================= 校验 + 纠错 ================= */

  /**
   * 用校验位和生日把识别结果"修"一遍。
   * 识别总有一两位看错，但身份证自带校验位（第 18 位），
   * 配合生日合法性，能把绝大多数错位纠正回来。
   *
   * 搜索顺序：直接通过 → 换 1 位 → 换 2 位 → 换 3 位。
   * 每次都优先动"最没把握"的位置，代价小的先试。
   */
  function correct(cands) {
    var best = cands.map(function (c) { return c[0]; });
    var rawStr = best.map(function (c) { return c.ch; }).join('').toUpperCase();

    /**
     * 生日段（第 7–14 位）的"改动上限"。
     *
     * 为什么单独管这一段：生日错一位，社保、公积金、劳动合同全跟着错，
     * 而且校验位有时会"碰巧"对上（实测过：19760419 被读成 19780219，校验位居然也过）。
     * 所以这一段的改动最多 1 位，改多了宁可报失败让人手输——错号比没识别更麻烦。
     */
    function birthdayRisk(chars) {
      var s = chars.map(function (c) { return c.ch; }).join('');
      var diff = 0;
      for (var i = 6; i < 14; i++) if (s.charAt(i) !== rawStr.charAt(i)) diff++;
      return diff > 1;
    }

    function tryBuild(chars) {
      var s = chars.map(function (c) { return c.ch; }).join('').toUpperCase();
      if (birthdayRisk(chars)) return null;
      return plausible(s) && checkCode(s.slice(0, 17)) === s.charAt(17) ? s : null;
    }

    var hit = tryBuild(best);
    if (hit) return { id: hit, fixed: 0 };

    // 不确定性：第一名分数越低、第二名咬得越紧，越没看清。最没把握的排前面
    var unc = best.map(function (c, i) {
      var second = cands[i][1] ? cands[i][1].score : 0;
      var u = (1 - c.score) + 0.5 * Math.max(0, 1 - (c.score - second) * 2.5);
      return { i: i, u: u };
    }).sort(function (a, b) { return b.u - a.u; });

    function alt(i) {
      var out = [];
      for (var k = 1; k < Math.min(3, cands[i].length); k++) out.push(cands[i][k]);
      return out;
    }

    // 换 1 位：从最没把握的位置开始试
    for (var a = 0; a < unc.length; a++) {
      var i1 = unc[a].i;
      var alts = alt(i1);
      for (var x = 0; x < alts.length; x++) {
        var t1 = best.slice();
        t1[i1] = alts[x];
        hit = tryBuild(t1);
        if (hit) return { id: hit, fixed: 1 };
      }
    }

    // 换 2 位：在最没把握的 8 个位置里组合
    var pool = unc.slice(0, 8).map(function (o) { return o.i; });
    for (var p = 0; p < pool.length; p++) {
      for (var q = p + 1; q < pool.length; q++) {
        var A = alt(pool[p]), B = alt(pool[q]);
        for (var xi = 0; xi < A.length; xi++) {
          for (var yi = 0; yi < B.length; yi++) {
            var t2 = best.slice();
            t2[pool[p]] = A[xi];
            t2[pool[q]] = B[yi];
            hit = tryBuild(t2);
            if (hit) return { id: hit, fixed: 2 };
          }
        }
      }
    }
    // 换 3 位：只在最没把握的 5 个位置里组合（10 组 × 8 种替换 ≈ 80 次，代价可控）
    var tiny = unc.slice(0, 5).map(function (o) { return o.i; });
    for (var r1 = 0; r1 < tiny.length; r1++) {
      for (var r2 = r1 + 1; r2 < tiny.length; r2++) {
        for (var r3 = r2 + 1; r3 < tiny.length; r3++) {
          var A3 = alt(tiny[r1]), B3 = alt(tiny[r2]), C3 = alt(tiny[r3]);
          for (var ai = 0; ai < A3.length; ai++) {
            for (var bi = 0; bi < B3.length; bi++) {
              for (var ci = 0; ci < C3.length; ci++) {
                var t3 = best.slice();
                t3[tiny[r1]] = A3[ai];
                t3[tiny[r2]] = B3[bi];
                t3[tiny[r3]] = C3[ci];
                hit = tryBuild(t3);
                if (hit) return { id: hit, fixed: 3 };
              }
            }
          }
        }
      }
    }
    // 到这里还不对，多半是照片本身糊了——宁可让手输，也不硬猜
    return null;
  }

  /* ================= 主流程 ================= */

  /** 在给定二值图上跑完整流程（不依赖 canvas，方便测试） */
  function runPipeline(data, gray, w, h, opts, bin) {
    bin = bin || binarize(gray, w, h);
    var loc = locateNumberRow(bin, gray, w, h);
    if (!loc) {
      return { ok: false, provider: 'local', mock: false, stage: 'locate',
        message: '没找到号码那一行——照片太糊、太暗或角度太斜的话，手输更省事' };
    }

    var segs = loc.segs;
    // 切出 18 个是最好的；少了就按宽度补不了，直接按已有顺序比对再纠错
    if (segs.length < 14) {
      return { ok: false, provider: 'local', mock: false, stage: 'segment',
        message: '号码被拍糊了，切不出完整的字——手输或重拍一张' };
    }
    if (segs.length > 22) {
      return { ok: false, provider: 'local', mock: false, stage: 'segment',
        message: '画面里干扰太多，没锁定号码——重拍一张，让号码填满横向画面' };
    }

    // 超过 18 段时，优先丢掉最不像数字的段；不足 18 段时保留原样，交给纠错
    var ranked = segs.map(function (seg) {
      var r = rankChar(data, w, h, seg, loc.y0, loc.y1);
      return { seg: seg, list: r, top: r[0].score };
    });
    if (ranked.length > 18) {
      ranked.sort(function (a, b) { return b.top - a.top; });
      ranked = ranked.slice(0, 18);
      ranked.sort(function (a, b) { return a.seg.x0 - b.seg.x0; });
    }

    var cands = ranked.map(function (r) { return r.list; });
    var avg = ranked.reduce(function (a, r) { return a + r.top; }, 0) / (ranked.length || 1);

    // 少于 18 段时位置就对不齐了，只有恰好 18 段才敢纠错
    var result = null;
    if (ranked.length === 18) result = correct(cands);
    if (!result) {
      var raw = cands.map(function (c) { return c[0].ch; }).join('').toUpperCase();
      if (raw.length === 18 && plausible(raw) && checkCode(raw.slice(0, 17)) === raw.charAt(17)) {
        result = { id: raw, fixed: 0 };
      }
    }

    if (!result) {
      return {
        ok: false, provider: 'local', mock: false, stage: 'verify',
        message: '看清了几位，但号码对不上校验位——手输一下更稳（顺手核对下有没有拍反）'
      };
    }

    // 置信度：比对相似度 × 有没有修过
    var conf = Math.max(0.5, Math.min(0.99, avg * (result.fixed ? 0.88 : 1)));
    return {
      ok: true,
      idcard: result.id,
      provider: 'local',
      mock: false,
      confidence: conf,
      fixed: result.fixed,
      message: result.fixed
        ? '已识别 ' + result.id + '（有 ' + result.fixed + ' 位是推算出来的，麻烦核对下）'
        : '已识别 ' + result.id + '，可以直接改'
    };
  }

  /**
   * 多路读法 + 交叉验证。
   *
   * 同一张照片，用四种预处理各读一遍：
   *   亮度灰度 × 全局阈值    （最常规，清晰照最准）
   *   最大通道 × 全局阈值    （压浅蓝底纹）
   *   亮度灰度 × 局部阈值    （抗反光、抗明暗不均）
   *   最大通道 × 局部阈值    （两个优点叠加）
   *
   * 几路都读出同一个号，才算"看清了"；读出两个不同的号，说明这张照片本身不稳，
   * 这时候宁可不给结果——给一个错号比让员工手输麻烦得多。
   */
  function stageRank(stage) {
    return { conflict: 4, verify: 3, segment: 2, locate: 1 }[stage] || 0;
  }

  function readVariants(px, opts) {
    var w = px.w, h = px.h;
    var luma = toGray(px.data, w, h);
    var maxc = toGrayMax(px.data, w, h);

    var plans = [
      { tag: 'lum+otsu', gray: luma, bin: binarize(luma, w, h) },
      { tag: 'max+otsu', gray: maxc, bin: binarize(maxc, w, h) },
      { tag: 'lum+sauvola', gray: luma, bin: sauvola(luma, w, h) },
      { tag: 'max+sauvola', gray: maxc, bin: sauvola(maxc, w, h) }
    ];

    var oks = [], closest = null;
    for (var i = 0; i < plans.length; i++) {
      var r = runPipeline(px.data, plans[i].gray, w, h, opts, plans[i].bin);
      r.variant = plans[i].tag;
      if (r.ok) oks.push(r);
      else if (!closest || stageRank(r.stage) > stageRank(closest.stage)) closest = r;
    }

    if (!oks.length) return closest;

    // 按号码投票
    var votes = {};
    oks.forEach(function (r) { votes[r.idcard] = (votes[r.idcard] || 0) + 1; });
    var ids = Object.keys(votes);

    if (ids.length === 1) {
      var win = oks[0];
      win.votes = votes[ids[0]];
      win.confidence = Math.min(0.99, win.confidence + 0.04 * (win.votes - 1));
      return win;
    }

    // 几路读法打架：不猜，交给人
    return {
      ok: false, provider: 'local', mock: false, stage: 'conflict',
      message: '这张照片不同读法结果不一致（' + ids.join(' / ') + '），怕给错号——手输核对一下'
    };
  }

  /** 轻微旋转再试一次——手持拍照多少有点斜 */
  function rotatePixels(data, w, h, deg) {
    var rad = deg * Math.PI / 180;
    var cos = Math.cos(rad), sin = Math.sin(rad);
    var out = new Uint8ClampedArray(w * h * 4);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var sx = Math.round((x - w / 2) * cos + (y - h / 2) * sin + w / 2);
        var sy = Math.round(-(x - w / 2) * sin + (y - h / 2) * cos + h / 2);
        var di = (y * w + x) * 4;
        if (sx < 0 || sy < 0 || sx >= w || sy >= h) {
          out[di] = out[di + 1] = out[di + 2] = 255; out[di + 3] = 255;
        } else {
          var si = (sy * w + sx) * 4;
          out[di] = data[si]; out[di + 1] = data[si + 1]; out[di + 2] = data[si + 2]; out[di + 3] = 255;
        }
      }
    }
    return out;
  }

  /**
   * 服务端识别（Tesseract）。
   *
   * 返回 null 表示「这条路走不通，交给本机那套」——比如双击 html 打开没后端、
   * 服务器没装 Tesseract、被限流。返回结果对象则表示服务端已经有明确结论，
   * 这时不再跑本机算法：它比服务端弱，重跑一遍只会让员工多等几秒。
   */
  function recognizeRemote(dataUrl, opts) {
    var api = root.Api;
    if (!api || typeof api.ocr !== 'function') return Promise.resolve(null);

    return api.ocr(dataUrl).then(function (r) {
      if (!r) return null;
      if (r.offline) return null;              // 连不上服务器
      if (r.provider === 'none') return null;  // 服务器没装引擎
      if (r.code === 'TOO_MANY') return null;  // 被限流，本机识别不消耗服务器资源
      if (r.code === 'BAD_BODY') return null;

      return {
        ok: !!r.ok,
        idcard: r.idcard || '',
        provider: 'tesseract',
        mock: false,
        confidence: r.confidence || 0,
        suspect: r.suspect || '',
        message: r.message || (r.ok ? '已识别 ' + r.idcard + '，可以直接改' : '没读出号码，手输一下更快')
      };
    }, function () {
      return null;
    });
  }

  /**
   * @param {string} dataUrl 图片 dataURL
   * @param {object} opts    { side: 'front'|'back', remote?: false 强制用本机识别 }
   * @returns {Promise<{ok:boolean, idcard?:string, provider:string, mock:boolean, message?:string}>}
   */
  function recognize(dataUrl, opts) {
    opts = opts || {};
    if (!dataUrl) {
      return Promise.resolve({ ok: false, provider: 'local', mock: false, message: '还没有照片' });
    }
    if (opts.side === 'back') {
      return Promise.resolve({ ok: false, provider: 'local', mock: false, message: '国徽面没有号码，已存档' });
    }
    if (opts.remote === false) return recognizeLocal(dataUrl, opts);

    return recognizeRemote(dataUrl, opts).then(function (r) {
      return r || recognizeLocal(dataUrl, opts);
    });
  }

  /** 本机识别（模板匹配）。服务端不可用时的兜底，也是没联网时的唯一办法 */
  function recognizeLocal(dataUrl, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      if (!dataUrl) {
        resolve({ ok: false, provider: 'local', mock: false, message: '还没有照片' });
        return;
      }
      if (opts.side === 'back') {
        resolve({ ok: false, provider: 'local', mock: false, message: '国徽面没有号码，已存档' });
        return;
      }

      decode(dataUrl).then(function (px) {
        if (!px) {
          resolve({ ok: false, provider: 'local', mock: false, message: '这张图读不出来，换一张试试' });
          return;
        }
        // 图太小，数字糊成一团，识别不了
        if (px.w < 320 || px.h < 200) {
          resolve({ ok: false, provider: 'local', mock: false,
            message: '图片分辨率太低，号码认不清——用原图或重拍一张' });
          return;
        }

        var best = readVariants(px, opts);

        // 四种读法都没成，再轻微转几个角度重来（手持拍照常有小角度倾斜）
        if (!best.ok && opts.rotate !== false) {
          var angles = [-4, 4, -2, 2, -6, 6];
          for (var i = 0; i < angles.length; i++) {
            var rot = rotatePixels(px.data, px.w, px.h, angles[i]);
            var r = readVariants({ data: rot, w: px.w, h: px.h }, opts);
            if (r.ok) { best = r; break; }
            if (stageRank(r.stage) > stageRank(best.stage)) best = r;
          }
        }

        // 绝不返回假号码：识别不出就是识别不出
        resolve(best);
      }, function () {
        resolve({ ok: false, provider: 'local', mock: false, message: '这张图读不出来，换一张试试' });
      });
    });
  }

  /** dataURL → 像素。浏览器用 Image，Node 用 node-canvas */
  function decode(dataUrl) {
    return new Promise(function (resolve, reject) {
      if (typeof document !== 'undefined') {
        var img = new Image();
        img.onload = function () {
          try {
            var cv = document.createElement('canvas');
            cv.width = img.naturalWidth; cv.height = img.naturalHeight;
            var ctx = cv.getContext('2d');
            ctx.drawImage(img, 0, 0);
            var d = ctx.getImageData(0, 0, cv.width, cv.height);
            resolve({ data: d.data, w: cv.width, h: cv.height });
          } catch (e) { reject(e); }
        };
        img.onerror = reject;
        img.src = dataUrl;
      } else {
        var C = root.__canvasCtor || (typeof require === 'function' && require('canvas'));
        C.loadImage(dataUrl).then(function (img) {
          var cv = C.createCanvas(img.width, img.height);
          var ctx = cv.getContext('2d');
          ctx.drawImage(img, 0, 0);
          var d = ctx.getImageData(0, 0, cv.width, cv.height);
          resolve({ data: d.data, w: cv.width, h: cv.height });
        }, reject);
      }
    });
  }

  root.OcrLite = {
    recognize: recognize,
    recognizeLocal: recognizeLocal,
    recognizeRemote: recognizeRemote,
    checkCode: checkCode,
    plausible: plausible,
    _runPipeline: runPipeline,
    _toGray: toGray,
    _toGrayMax: toGrayMax,
    _binarize: binarize,
    _sauvola: sauvola,
    _readVariants: readVariants,
    _locate: locateNumberRow,
    _rankChar: rankChar,
    _correct: correct,
    _buildTemplates: buildTemplates,
    CHARS: CHARS
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== qr-lite.js ===== */
/**
 * qr-lite.js —— 零依赖二维码生成（只做「网址」这一种用途，不追求全功能）
 *
 * 为什么自己写：整个项目到现在没有一行第三方依赖，扫码是 HR 发链接的主要方式，
 * 为了一张二维码去引一个几百 KB 的库不划算。
 *
 * 支持：
 *   - byte 模式（中文自动转 UTF-8）
 *   - 版本 1~10（M 级最多 213 字节，链接够用），超长自动降到 L 级
 *   - 输出矩阵 / SVG 字符串
 *
 * 用法：
 *   var q = QrLite.encode('https://example.com/');
 *   QrLite.toSvg(q, { scale: 8 })      → '<svg ...>'
 *   QrLite.toCanvas(q, canvasEl)       → 画到 canvas 上
 *

 * 同一 version/EC/mask 下矩阵必须完全一致。
 */
(function (root, factory) {

})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------------- 常量表 ---------------- */

  // 格式信息里 EC 级别的编码

  // 每个版本的总码字数（数据 + 纠错）

  // 纠错块结构：[每块纠错码字数, 组1块数, 组1每块数据码字, 组2块数, 组2每块数据码字]
  var BLOCKS = {
    1: { L: [7, 1, 19, 0, 0], M: [10, 1, 16, 0, 0], Q: [13, 1, 13, 0, 0], H: [17, 1, 9, 0, 0] },
    2: { L: [10, 1, 34, 0, 0], M: [16, 1, 28, 0, 0], Q: [22, 1, 22, 0, 0], H: [28, 1, 16, 0, 0] },
    3: { L: [15, 1, 55, 0, 0], M: [26, 1, 44, 0, 0], Q: [18, 2, 17, 0, 0], H: [22, 2, 13, 0, 0] },
    4: { L: [20, 1, 80, 0, 0], M: [18, 2, 32, 0, 0], Q: [26, 2, 24, 0, 0], H: [16, 4, 9, 0, 0] },
    5: { L: [26, 1, 108, 0, 0], M: [24, 2, 43, 0, 0], Q: [18, 2, 15, 2, 16], H: [22, 2, 11, 2, 12] },
    6: { L: [18, 2, 68, 0, 0], M: [16, 4, 27, 0, 0], Q: [24, 4, 19, 0, 0], H: [28, 4, 15, 0, 0] },
    7: { L: [20, 2, 78, 0, 0], M: [18, 4, 31, 0, 0], Q: [18, 2, 14, 4, 15], H: [26, 4, 13, 1, 14] },
    8: { L: [24, 2, 97, 0, 0], M: [22, 2, 38, 2, 39], Q: [22, 4, 18, 2, 19], H: [26, 4, 14, 2, 15] },
    9: { L: [30, 2, 116, 0, 0], M: [22, 3, 36, 2, 37], Q: [20, 4, 16, 4, 17], H: [24, 4, 12, 4, 13] },
    10: { L: [18, 2, 68, 2, 69], M: [26, 4, 43, 1, 44], Q: [24, 6, 19, 2, 20], H: [28, 6, 15, 2, 16] }
  };

  // 校正图形中心坐标
  var ALIGN = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
    6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50]
  };

  /* ---------------- GF(256) ---------------- */

  var EXP = new Uint8Array(512);
  var LOG = new Uint8Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) {
      EXP[i] = x;
      LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11d;
    }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
  })();

  function gfMul(a, b) {
    if (a === 0 || b === 0) return 0;
    return EXP[LOG[a] + LOG[b]];
  }

  /** 生成多项式 g(x)=∏(x-α^i)，返回长度 ecLen+1 的系数数组（[0]=最高次，恒为 1） */
  function genPoly(ecLen) {
    var g = [1];
    for (var i = 0; i < ecLen; i++) {
      var next = new Array(g.length + 1);
      for (var k = 0; k < next.length; k++) next[k] = 0;
      for (var j = 0; j < g.length; j++) {
        next[j] ^= g[j];
        next[j + 1] ^= gfMul(g[j], EXP[i]);
      }
      g = next;
    }
    return g;
  }

  /** 多项式长除法，返回 ecLen 个纠错码字 */
  function rsEncode(data, ecLen) {
    var g = genPoly(ecLen);
    var buf = new Array(data.length + ecLen);
    var i;
    for (i = 0; i < data.length; i++) buf[i] = data[i];
    for (i = 0; i < ecLen; i++) buf[data.length + i] = 0;

    for (i = 0; i < data.length; i++) {
      var coef = buf[i];
      if (coef !== 0) {
        for (var j = 0; j < g.length; j++) buf[i + j] ^= gfMul(g[j], coef);
      }
    }
    return buf.slice(data.length);
  }

  /* ---------------- 数据编码 ---------------- */

  /** 字符串 → UTF-8 字节。老手机上 TextEncoder 不一定有，自己转一份 */
  function utf8Bytes(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c < 0x80) {
        out.push(c);
      } else if (c < 0x800) {
        out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      } else if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) {
        var c2 = str.charCodeAt(i + 1);
        var cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3f), 0x80 | ((cp >> 6) & 0x3f), 0x80 | (cp & 0x3f));
        i++;
      } else {
        out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
      }
    }
    return out;
  }

  function dataCapacity(ver, ec) {
    var b = BLOCKS[ver][ec];
    return b[1] * b[2] + b[3] * b[4];
  }

  function countBits(ver) { return ver <= 9 ? 8 : 16; }

  function pickVersion(byteLen, ec) {
    for (var v = 1; v <= 10; v++) {
      var capBits = dataCapacity(v, ec) * 8;
      var need = 4 + countBits(v) + byteLen * 8;
      if (need <= capBits) return v;
    }
    return 0;
  }

  function buildCodewords(bytes, ver, ec) {
    var bits = [];
    function put(val, len) {
      for (var i = len - 1; i >= 0; i--) bits.push((val >> i) & 1);
    }

    put(4, 4);                              // byte 模式
    put(bytes.length, countBits(ver));      // 字符数
    for (var i = 0; i < bytes.length; i++) put(bytes[i], 8);

    var capBits = dataCapacity(ver, ec) * 8;
    // 终止符
    for (var t = 0; t < 4 && bits.length < capBits; t++) bits.push(0);
    // 补齐到字节
    while (bits.length % 8 !== 0) bits.push(0);

    var words = [];
    for (var b = 0; b < bits.length; b += 8) {
      var byte = 0;
      for (var k = 0; k < 8; k++) byte = (byte << 1) | bits[b + k];
      words.push(byte);
    }
    // 填充字节 EC 11 交替
    var pad = [0xec, 0x11];
    var p = 0;
    while (words.length < dataCapacity(ver, ec)) words.push(pad[p++ % 2]);
    return words;
  }

  /** 分块 + 纠错 + 交织 */
  function addEcc(words, ver, ec) {
    var b = BLOCKS[ver][ec];
    var ecLen = b[0], g1 = b[1], g1d = b[2], g2 = b[3], g2d = b[4];
    var blocks = [];
    var pos = 0;
    var i;
    for (i = 0; i < g1; i++) { blocks.push(words.slice(pos, pos + g1d)); pos += g1d; }
    for (i = 0; i < g2; i++) { blocks.push(words.slice(pos, pos + g2d)); pos += g2d; }

    var eccs = blocks.map(function (d) { return rsEncode(d, ecLen); });

    var out = [];
    // 交织要按"最长的那种块"来走，组 2 的块比组 1 多一个数据码字，
    // 少了这一步，组 2 每块会丢掉最后一个码字（v8-M 就会少 2 个）。
    var maxLen = Math.max(g1d, g2d);
    for (i = 0; i < maxLen; i++) {
      for (var j = 0; j < blocks.length; j++) {
        if (i < blocks[j].length) out.push(blocks[j][i]);
      }
    }
    for (i = 0; i < ecLen; i++) {
      for (var k = 0; k < eccs.length; k++) out.push(eccs[k][i]);
    }
    return out;
  }

  /* ---------------- 矩阵 ---------------- */

  function Matrix(ver) {
    this.ver = ver;
    this.size = 17 + ver * 4;
    this.dark = new Uint8Array(this.size * this.size);
    this.fixed = new Uint8Array(this.size * this.size);   // 1 = 功能图形，不参与掩码
  }

  Matrix.prototype.set = function (x, y, v) {
    if (x < 0 || y < 0 || x >= this.size || y >= this.size) return;
    this.dark[y * this.size + x] = v ? 1 : 0;
  };
  Matrix.prototype.get = function (x, y) {
    if (x < 0 || y < 0 || x >= this.size || y >= this.size) return 0;
    return this.dark[y * this.size + x];
  };
  Matrix.prototype.setFixed = function (x, y, v) {
    this.set(x, y, v);
    if (x >= 0 && y >= 0 && x < this.size && y < this.size) this.fixed[y * this.size + x] = 1;
  };

  function drawFinder(m, cx, cy) {
    for (var dy = -4; dy <= 4; dy++) {
      for (var dx = -4; dx <= 4; dx++) {
        var d = Math.max(Math.abs(dx), Math.abs(dy));
        m.setFixed(cx + dx, cy + dy, d !== 2 && d !== 4 ? 1 : 0);
      }
    }
  }

  function drawAlign(m, cx, cy) {
    for (var dy = -2; dy <= 2; dy++) {
      for (var dx = -2; dx <= 2; dx++) {
        var d = Math.max(Math.abs(dx), Math.abs(dy));
        m.setFixed(cx + dx, cy + dy, d !== 1 ? 1 : 0);
      }
    }
  }

  function drawFormat(m, ec, mask) {
    var data = (EC_BITS[ec] << 3) | mask;
    var rem = data;
    for (var i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    var bits = ((data << 10) | rem) ^ 0x5412;
    function bit(i) { return (bits >>> i) & 1; }

    var n = m.size;
    // 左上角那一份
    for (i = 0; i <= 5; i++) m.setFixed(8, i, bit(i));
    m.setFixed(8, 7, bit(6));
    m.setFixed(8, 8, bit(7));
    m.setFixed(7, 8, bit(8));
    for (i = 9; i <= 14; i++) m.setFixed(14 - i, 8, bit(i));
    // 右上 + 左下那一份
    for (i = 0; i <= 7; i++) m.setFixed(n - 1 - i, 8, bit(i));
    for (i = 8; i <= 14; i++) m.setFixed(8, n - 15 + i, bit(i));
    // 固定的深色模块
    m.setFixed(8, n - 8, 1);
  }

  function drawVersion(m) {
    if (m.ver < 7) return;
    var rem = m.ver;
    for (var i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    var bits = (m.ver << 12) | rem;
    for (i = 0; i < 18; i++) {
      var v = (bits >>> i) & 1;
      var a = m.size - 11 + (i % 3);
      var b = Math.floor(i / 3);
      m.setFixed(a, b, v);
      m.setFixed(b, a, v);
    }
  }

  function drawFunctionPatterns(m, ec, mask) {
    var n = m.size;
    var i, j;

    // 定位图形
    drawFinder(m, 3, 3);
    drawFinder(m, n - 4, 3);
    drawFinder(m, 3, n - 4);

    // 定时图形
    for (i = 8; i < n - 8; i++) {
      m.setFixed(i, 6, i % 2 === 0 ? 1 : 0);
      m.setFixed(6, i, i % 2 === 0 ? 1 : 0);
    }

    // 校正图形（跳过和定位图形重叠的位置）
    var pos = ALIGN[m.ver];
    for (i = 0; i < pos.length; i++) {
      for (j = 0; j < pos.length; j++) {
        var cx = pos[i], cy = pos[j];
        if ((cx === 6 && cy === 6) || (cx === 6 && cy === n - 7) || (cx === n - 7 && cy === 6)) continue;
        drawAlign(m, cx, cy);
      }
    }

    drawFormat(m, ec, mask);
    drawVersion(m);
  }

  var MASK_FN = [
    function (x, y) { return (x + y) % 2 === 0; },
    function (x, y) { return y % 2 === 0; },
    function (x, y) { return x % 3 === 0; },
    function (x, y) { return (x + y) % 3 === 0; },
    function (x, y) { return (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0; },
    function (x, y) { return (x * y) % 2 + (x * y) % 3 === 0; },
    function (x, y) { return ((x * y) % 2 + (x * y) % 3) % 2 === 0; },
    function (x, y) { return ((x + y) % 2 + (x * y) % 3) % 2 === 0; }
  ];

  function drawCodewords(m, codewords) {
    var n = m.size;
    var i = 0;   // 位下标
    var total = codewords.length * 8;

    for (var right = n - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;                 // 跳过定时列
      for (var vert = 0; vert < n; vert++) {
        for (var j = 0; j < 2; j++) {
          var x = right - j;
          var upward = ((right + 1) & 2) === 0;
          var y = upward ? n - 1 - vert : vert;
          if (!m.fixed[y * n + x]) {
            var bit = 0;
            if (i < total) bit = (codewords[i >>> 3] >>> (7 - (i & 7))) & 1;
            m.dark[y * n + x] = bit;
            i++;
          }
        }
      }
    }
  }

  function applyMask(m, mask) {
    var fn = MASK_FN[mask];
    var n = m.size;
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        if (!m.fixed[y * n + x] && fn(x, y)) m.dark[y * n + x] ^= 1;
      }
    }
  }

  /** 掩码评分（按标准四条规则，用来挑视觉上最干净的那个掩码） */
  function penalty(m) {
    var n = m.size;
    var score = 0;
    var x, y, i;

    // 规则1：连续同色 5 个以上
    for (y = 0; y < n; y++) {
      var runColor = -1, runLen = 0;
      for (x = 0; x < n; x++) {
        var c = m.get(x, y);
        if (c === runColor) { runLen++; }
        else { if (runLen >= 5) score += 3 + (runLen - 5); runColor = c; runLen = 1; }
      }
      if (runLen >= 5) score += 3 + (runLen - 5);
    }
    for (x = 0; x < n; x++) {
      var rc = -1, rl = 0;
      for (y = 0; y < n; y++) {
        var c2 = m.get(x, y);
        if (c2 === rc) { rl++; }
        else { if (rl >= 5) score += 3 + (rl - 5); rc = c2; rl = 1; }
      }
      if (rl >= 5) score += 3 + (rl - 5);
    }

    // 规则2：2x2 同色块
    for (y = 0; y < n - 1; y++) {
      for (x = 0; x < n - 1; x++) {
        var a = m.get(x, y);
        if (a === m.get(x + 1, y) && a === m.get(x, y + 1) && a === m.get(x + 1, y + 1)) score += 3;
      }
    }

    // 规则3：形似定位图形 1011101 且一侧有 4 个空白
    var PAT = [1, 0, 1, 1, 1, 0, 1, 0, 0, 0, 0];
    function looksFinder(arr) {
      for (var k = 0; k < 11; k++) if (arr[k] !== PAT[k]) return false;
      return true;
    }
    function reversed(arr) { return arr.slice().reverse(); }
    for (y = 0; y < n; y++) {
      for (x = 0; x <= n - 11; x++) {
        var row = [];
        for (i = 0; i < 11; i++) row.push(m.get(x + i, y));
        if (looksFinder(row) || looksFinder(reversed(row))) score += 40;
      }
    }
    for (x = 0; x < n; x++) {
      for (y = 0; y <= n - 11; y++) {
        var col = [];
        for (i = 0; i < 11; i++) col.push(m.get(x, y + i));
        if (looksFinder(col) || looksFinder(reversed(col))) score += 40;
      }
    }

    // 规则4：深色比例偏离 50%
    var dark = 0;
    for (i = 0; i < m.dark.length; i++) dark += m.dark[i];
    var ratio = dark * 100 / (n * n);
    score += Math.floor(Math.abs(ratio - 50) / 5) * 10;

    return score;
  }

  /* ---------------- 对外接口 ---------------- */

  /**
   * 生成二维码
   * @param {string} text  要编码的内容
   * @param {object} [opt] { ec: 'M'|'L'|'Q'|'H', mask: 0-7 强制掩码, version: 强制版本 }
   * @returns {{size:number, modules:Uint8Array, version:number, ec:string, mask:number}}
   */
  function encode(text, opt) {
    opt = opt || {};
    var ec = opt.ec || 'M';
    var bytes = utf8Bytes(String(text));

    var ver = opt.version || pickVersion(bytes.length, ec);
    if (!ver) {
      // M 级放不下就退到 L 级再试一次
      if (ec === 'M' && !opt.version) { ec = 'L'; ver = pickVersion(bytes.length, ec); }
      if (!ver) throw new Error('内容太长，二维码放不下（' + bytes.length + ' 字节）');
    }

    var words = buildCodewords(bytes, ver, ec);
    var codewords = addEcc(words, ver, ec);

    var best = null;
    var bestScore = Infinity;
    var bestMask = 0;
    var masks = (typeof opt.mask === 'number') ? [opt.mask] : [0, 1, 2, 3, 4, 5, 6, 7];

    for (var k = 0; k < masks.length; k++) {
      var m = new Matrix(ver);
      drawFunctionPatterns(m, ec, masks[k]);
      drawCodewords(m, codewords);
      applyMask(m, masks[k]);
      // 掩码会改数据区，格式信息得重画（applyMask 不碰 fixed，所以不用重画，这里保险起见再描一次）
      var s = penalty(m);
      if (!best || s < bestScore) { best = m; bestScore = s; bestMask = masks[k]; }
    }

    return {
      size: best.size,
      modules: best.dark,
      version: ver,
      ec: ec,
      mask: bestMask
    };
  }

  /** 输出 SVG 字符串。quiet = 静区模块数（标准要求 4） */
  function toSvg(qr, opt) {
    opt = opt || {};
    var scale = opt.scale || 8;
    var quiet = opt.quiet === undefined ? 4 : opt.quiet;
    var dim = (qr.size + quiet * 2) * scale;
    var dark = opt.dark || '#000000';
    var light = opt.light || '#ffffff';
    var parts = [];

    parts.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + dim + '" height="' + dim
      + '" viewBox="0 0 ' + dim + ' ' + dim + '" shape-rendering="crispEdges">');
    parts.push('<rect width="' + dim + '" height="' + dim + '" fill="' + light + '"/>');
    // 一行一行的连续段，比一个小方块一个 <rect> 短很多
    for (var y = 0; y < qr.size; y++) {
      var x = 0;
      while (x < qr.size) {
        if (qr.modules[y * qr.size + x]) {
          var start = x;
          while (x < qr.size && qr.modules[y * qr.size + x]) x++;
          parts.push('<rect x="' + ((start + quiet) * scale) + '" y="' + ((y + quiet) * scale)
            + '" width="' + ((x - start) * scale) + '" height="' + scale + '" fill="' + dark + '"/>');
        } else {
          x++;
        }
      }
    }
    parts.push('</svg>');
    return parts.join('');
  }

  /** 画到 canvas 上（比 SVG 更容易直接存成图片） */
  function toCanvas(qr, canvas, opt) {
    opt = opt || {};
    var quiet = opt.quiet === undefined ? 4 : opt.quiet;
    var modules = qr.size + quiet * 2;
    var px = opt.pixelSize || 640;
    var scale = Math.max(1, Math.floor(px / modules));
    var dim = modules * scale;

    canvas.width = dim;
    canvas.height = dim;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = opt.light || '#ffffff';
    ctx.fillRect(0, 0, dim, dim);
    ctx.fillStyle = opt.dark || '#000000';
    for (var y = 0; y < qr.size; y++) {
      for (var x = 0; x < qr.size; x++) {
        if (qr.modules[y * qr.size + x]) {
          ctx.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
        }
      }
    }
    return canvas;
  }

  return {
    encode: encode,
    toSvg: toSvg,
    toCanvas: toCanvas,
    _internals: {
      utf8Bytes: utf8Bytes,
      rsEncode: rsEncode,
      buildCodewords: buildCodewords,
      addEcc: addEcc,
      BLOCKS: BLOCKS,
      dataCapacity: dataCapacity
    }
  };
});

<script>
/* ===== api.js ===== */
/**
 * 前端和服务端之间的那一层
 *
 * 设计原则：有服务器就用，没服务器照样能用。
 *   - 用 http(s) 打开（部署在服务器上）→ 提交的数据存到服务器，HR 能拉到别人的
 *   - 直接双击 html 打开（file://）→ 自动退回浏览器本地存储，只适合自己演示
 *
 * 所以下面的函数失败时都只是"没连上"，不抛异常，页面逻辑不用 try/catch 包一层又一层。
 */
(function (root) {
  'use strict';

  var state = {
    online: false,      // 服务器是否可用
    checked: false,     // 是否已经探测过
    token: '',          // HR 登录后的 token
    empNo: '',
    lastError: '',
    origin: '',         // 服务器认为的"对外地址"，生成二维码用
    requireCode: false, // 服务端是否要求填写口令
    guide: null         // 提交之后给员工看的「下一站」内容（HR 在后台改）
  };

  var T_KEY = 'onboard_hr_token_v1';

  function loadToken() {
    try {
      var raw = sessionStorage.getItem(T_KEY) || localStorage.getItem(T_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && o.token && o.exp > Date.now()) { state.token = o.token; state.empNo = o.empNo || ''; }
      }
    } catch (e) { /* 无痕模式忽略 */ }
  }

  function saveToken(token, empNo, hours) {
    state.token = token || '';
    state.empNo = empNo || '';
    try {
      var o = JSON.stringify({ token: token, empNo: empNo, exp: Date.now() + (hours || 8) * 3600 * 1000 });
      sessionStorage.setItem(T_KEY, o);
      localStorage.setItem(T_KEY, o);
    } catch (e) { /* 忽略 */ }
  }

  function clearToken() {
    state.token = '';
    state.empNo = '';
    try {
      sessionStorage.removeItem(T_KEY);
      localStorage.removeItem(T_KEY);
    } catch (e) { /* 忽略 */ }
  }

  function req(method, url, body, timeoutMs) {
    // 老浏览器 / 某些 App 内置浏览器没有 fetch，当作离线处理，不让整个页面崩掉
    if (typeof fetch !== 'function') {
      state.lastError = '这个浏览器不支持 fetch';
      return Promise.resolve({ ok: false, offline: true, message: state.lastError });
    }

    var opt = {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store'
    };
    if (state.token) opt.headers['x-token'] = state.token;
    if (body) opt.body = JSON.stringify(body);

    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    if (ctrl) {
      opt.signal = ctrl.signal;
      setTimeout(function () { ctrl.abort(); }, timeoutMs || 20000);
    }

    return fetch(url, opt).then(function (r) {
      return r.json().catch(function () { return { ok: false, message: 'HTTP ' + r.status }; });
    }).catch(function (e) {
      state.lastError = e && e.name === 'AbortError' ? '请求超时' : '连不上服务器';
      return { ok: false, offline: true, message: state.lastError };
    });
  }

  /** 探测服务器在不在。双击 html 打开时这里会失败，属于正常情况。 */
  function ping() {
    if (location.protocol !== 'http:' && location.protocol !== 'https:') {
      state.online = false; state.checked = true;
      return Promise.resolve(false);
    }
    if (typeof fetch !== 'function') {
      state.online = false; state.checked = true;
      return Promise.resolve(false);

      if (!visible(field, values)) return;

      const text = fmt(field, values[field.key], values);

      // 同一列可能对应多个表单字段（如「职称或资格证书」同时收职称与证书），
      // 这种情况合并成一个单元格，而不是谁先谁占位
      if (index[field.rosterKey] !== undefined) {
        const item = list[index[field.rosterKey]];
        const sep = field.rosterJoin === undefined ? ' / ' : field.rosterJoin;
        if (!isEmpty(text)) item.value = item.value ? item.value + sep + text : text;
        return;
      }

      index[field.rosterKey] = list.length;
      list.push({ key: field.rosterKey, cn: field.label, value: text });
    });
  });

  CONSTANTS.forEach(c => {
    if (index[c.key] === undefined) list.push(c);
  });

  return list;
}

/**
 * 生成「导入花名册」格式的一行数据（对齐 119 列）
 *
 * 摩卡导入要求列顺序、行结构完全一致，所以这里不做任何裁剪，
 * 没采集到的列留空字符串，而不是省略（省略会错列）。
 *
 * @returns {string[]} 长度固定 119，与 ROSTER.COLUMNS 一一对应
 */
function buildRosterRow(values) {
  const map = {};
  buildRoster(values).forEach(it => {
    map[it.key] = it.value;
  });

  Object.keys(ROSTER.FIXED).forEach(k => {
    if (!map[k]) map[k] = ROSTER.FIXED[k];
  });

  return ROSTER.COLUMNS.map(c => {
    const v = map[c.key];
    return v === undefined || v === null ? '' : String(v);
  });
}

/** 导入前必须补齐的列（花名册模板里 isRequired=1 的只有这两个） */
function missingRequired(row) {
  const miss = [];
  ROSTER.COLUMNS.forEach((c, i) => {
    if (c.conf.indexOf('"isRequired":1') > -1 && !String(row[i] || '').trim()) {
      miss.push(c.cn.replace(/^\*/, ''));
    }
  });
  return miss;
}

module.exports = {
  buildBlocks,
  buildRoster,
  buildRosterRow,
  missingRequired,
  ROSTER
};

<script>
/* ===== pack.js ===== */
/**
 * pack.js —— 把「一个人的资料」打成文件夹，再把所有人的文件夹打成一个 zip
 *
 * 目录结构（HR 解压后看到的，就是需求里说的十个文件夹）：
 *
 *   入职档案_2026-10-20/
 *   ├── 花名册导入_10人_2026-10-20.xlsx     ← 融合版花名册，在所有人文件夹之外
 *   ├── 打包说明.txt
 *   ├── 张明远/
 *   │   ├── 张明远_员工信息登记表.docx
 *   │   ├── 张明远_身份证正面.jpg
 *   │   └── 张明远_身份证反面.jpg
 *   ├── 李思睿/
 *   └── …
 *
 * 浏览器不给网页直接建本地文件夹的权限，所以「按名字分文件夹」只能靠 zip 实现：
 * 解压出来就是真文件夹，Windows / macOS 双击都行，不需要装任何东西。
 *
 * 只出 Word，不出 PDF。PDF 只有让 Word 自己转才准；在浏览器里按网格重画一遍，
 * 字距、行高、分页一定对不上，交出去是一份"看着像、其实不一样"的文件。
 * HR 手上有批量转 PDF 的工具，要归档时拿 Word 转一次就行，所以这里干脆不画。
 */
(function (root) {
  'use strict';

  function safe(name, fallback) {
    var s = String(name == null ? '' : name).trim()
      .replace(/[\\/:*?"<>|\r\n\t]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (!s) s = fallback || '未命名';
    return s.slice(0, 40);
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function fmt(iso) {
    var d = new Date(iso || Date.now());
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
      + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function day(iso) {
    var d = new Date(iso || Date.now());
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  /**
   * rec.values 里只有基本字段，受教育情况 / 工作经历在 rec.tables 里。
   * 打印、花名册、Word 都要用合并后的这一份，否则那两栏永远是空的。
   */
  function fullValues(rec) {
    return Object.assign({}, (rec && rec.values) || {}, (rec && rec.tables) || {});
  }

  /** 记录 -> DocxLite 共用的模型 */
  function model(rec, opts) {
    opts = opts || {};
    return {
      title: opts.title || '员工信息登记表',
      meta: ['登记编号：' + (rec.formNo || '—'), '提交时间：' + fmt(rec.submittedAt)],
      header: '应聘职位：________________　　部门：________________　　工号：____________',
      blocks: root.APP.exporter.buildBlocks(fullValues(rec)),
      footer: '本表由员工本人填写；身份证原件已核验，正反面照片与本文件放在同一个文件夹内。'
    };
  }

  /** dataURL -> { ext, bytes } */
  function photoFile(dataUrl) {
    var m = /^data:image\/([a-z0-9.+-]+);base64,/i.exec(String(dataUrl || ''));
    if (!m) return null;
    var type = m[1].toLowerCase();
    var ext = type === 'jpeg' ? 'jpg' : (type === 'png' ? 'png' : type);
    var bin = root.atob(String(dataUrl).split(',')[1] || '');
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) & 0xFF;
    return { ext: ext, bytes: bytes };
  }

  function blobBytes(blob) {
    return blob.arrayBuffer().then(function (ab) { return new Uint8Array(ab); });
  }

  /**
   * @param {Array} records 提交记录数组
   * @param {object} opts   { withWord:boolean, withSingleXlsx:boolean }
   * @returns {Promise<{bytes:Uint8Array, name:string, report:object}>}
   */
  function build(records, opts) {
    opts = opts || {};
    var list = (records || []).filter(Boolean);
    if (!list.length) return Promise.reject(new Error('没有可导出的记录'));

    var withWord = opts.withWord !== false;
    var withSingle = opts.withSingleXlsx !== false;

    var batchDay = day(list[0].submittedAt);
    var rootDir = '入职档案_' + batchDay + '/';
    var zip = root.ZipLite.create();
    var used = {};
    var report = { persons: 0, word: 0, photos: 0, missingPhoto: [], wordFail: [] };
    var rosterName = '花名册导入_' + list.length + '人_' + batchDay + '.xlsx';

    zip.dir(rootDir);

    // 1. 融合版花名册（在所有人的文件夹之外）
    var rosterRows = list.map(function (r) { return root.APP.exporter.buildRosterRow(fullValues(r)); });

    var chain = blobBytes(root.XLSXLite.fromTemplate(rosterRows)).then(function (bytes) {
      zip.add(rootDir + rosterName, bytes);
    });

    // 2. 一个人一个文件夹（串行；每个人之间让出一个 tick，页面才画得动进度）
    list.forEach(function (rec, idx) {
      chain = chain.then(function () {
        return new Promise(function (r) { setTimeout(r, 0); });
      }).then(function () {
        var name = safe(rec.values && rec.values.realName, '未命名' + (idx + 1));
        var folder = name;
        if (used[folder]) {
          used[folder] += 1;
          folder = name + '(' + used[folder] + ')';
        } else {
          used[folder] = 1;
        }
        var dir = rootDir + folder + '/';
        zip.dir(dir);
        report.persons += 1;

        var base = folder + '_员工信息登记表';

        if (withWord) {
          try {
            // 走公司模板母版：版式和纸质表一模一样，黑白、可签字盖章
            zip.add(dir + base + '.docx', root.TemplateDocx.build(fullValues(rec), {
              noWork: !!(rec.values && rec.values.noWork)
            }));
            report.word += 1;
          } catch (e) {
            console.warn('[pack] Word 生成失败', folder, e);
            report.wordFail.push(folder);
          }
        }

        // 3. 身份证正反面（员工自己拍的图，原样放进去）
        var photos = (rec.idPhotos || {});
        [['front', '身份证正面'], ['back', '身份证反面']].forEach(function (p) {
          var f = photoFile(photos[p[0]]);
          if (!f) { report.missingPhoto.push(folder + ' · ' + p[1]); return; }
          zip.add(dir + folder + '_' + p[1] + '.' + f.ext, f.bytes);
          report.photos += 1;
        });

        // 4. 这个人的花名册单行，方便 HR 只补一个人
        if (!withSingle) return;
        return blobBytes(root.XLSXLite.fromTemplate([root.APP.exporter.buildRosterRow(fullValues(rec))]))
          .then(function (b) { zip.add(dir + folder + '_花名册单行.xlsx', b); })
          .catch(function (e) { console.warn('[pack] 单行花名册失败', folder, e); });
      });
    });

    return chain.then(function () {
      zip.text(rootDir + '打包说明.txt', readme(list.length, rosterName, report));
      return {
        bytes: zip.bytes(),
        name: rootDir.replace(/\/$/, '') + '.zip',
        report: report
      };
    });
  }

  function readme(n, rosterName, report) {
    var lines = [
      '员工入职资料包',
      '══════════════════════════',
      '',
      '一共 ' + n + ' 人，每人一个文件夹，文件夹名就是员工姓名。',
      '每个文件夹里有：',
      '  · 姓名_员工信息登记表.docx   —— 公司《员工信息登记表》原模板，',
      '                                 字已经填好、照片和手写签名都嵌在里面，',
      '                                 黑白可直接打印签字盖章',
      '  · 姓名_身份证正面.jpg / 身份证反面.jpg —— 员工本人拍照上传的原图',
      '  · 姓名_花名册单行.xlsx       —— 只需要补一个人时用这个',
      '',
      '文件夹外面那个 Excel：',
      '  ' + rosterName,
      '  这就是「融合版花名册」——拿公司模板当底板，一人一行，',
      '  12 个隐藏工作表、258 条下拉验证都在，可以直接导入摩卡。',
      '  导入前记得补工号（模板里只有姓名、工号两个必填列）。',
      '',
      '关于 PDF：',
      '  这个包里只放 Word，不放 PDF。网页里画出来的 PDF 和 Word 排版对不上，',
      '  与其给人一份"看着像、其实不一样"的文件，不如不给。需要归档时用',
      '  Word 打开另存为 PDF，或者用批量转换工具转一次，出来的就是标准版式。',
      '',
      '为什么不是在网页里直接建文件夹：',
      '  浏览器没有写本地目录的权限。zip 解压出来就是真文件夹，',
      '  Windows / macOS 双击都能开，不用装任何软件。',
      ''
    ];

    if (report.missingPhoto.length) {
      lines.push('缺少身份证照片 ' + report.missingPhoto.length + ' 张：');
      report.missingPhoto.forEach(function (x) { lines.push('  · ' + x); });
      lines.push('');
    }
    if (report.wordFail.length) {
      lines.push('Word 生成失败 ' + report.wordFail.length + ' 人：' + report.wordFail.join('、'));
      lines.push('');
    }
    lines.push('提示：包里是全体新员工的身份证照片，属于个人敏感信息，请勿外发。');
    return lines.join('\n');
  }

  root.Pack = { build: build, model: model, safe: safe, fullValues: fullValues };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  /* ================= 工具 ================= */

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

  }

  function toast(msg, type) {

  /* ================= 弹层（页面内的，不用系统弹窗） ================= */

  function openSheet(html, onClose) {

    var input = $('#sheetBox input');

  }

  function closeSheet() {
    var el = $('#sheet');
    if (!el) return;
    el.hidden = true;
    el.classList.remove('is-on');
    document.body.classList.remove('no-scroll');

  /** 问一次填写口令，输完回调；取消就什么都不做 */
